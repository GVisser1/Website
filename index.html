<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- For crawlers and link previews that don't run JavaScript; routes replace the marked title and description at runtime -->
    <title data-static-head>Glenn Visser</title>
    <meta
      name="description"
      data-static-head
      content="Personal website of Glenn Visser, a QA Engineer from Maassluis, the Netherlands, with a love for music, movies, and games."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glenn Visser" />
    <meta property="og:url" content="https://glennvisser.com/" />
    <meta property="og:title" content="Glenn Visser" />
    <meta
      property="og:description"
      content="Personal website of Glenn Visser, a QA Engineer from Maassluis, the Netherlands, with a love for music, movies, and games."
    />
    <meta property="og:image" content="https://glennvisser.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glenn Visser, QA Engineer from Maassluis, the Netherlands" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Glenn Visser",
        "url": "https://glennvisser.com/",
        "image": "https://glennvisser.com/images/profile.webp",
        "jobTitle": "QA Engineer",
        "worksFor": { "@type": "Organization", "name": "MoreApp", "url": "https://moreapp.com" },
        "address": { "@type": "PostalAddress", "addressLocality": "Maassluis", "addressCountry": "NL" },
        "sameAs": [
          "https://linkedin.com/in/g-visser",
          "https://instagram.com/instaglenn_",
          "https://letterboxd.com/gvisser/",
          "https://last.fm/user/instaglenn",
          "https://open.spotify.com/user/iglenn2345"
        ]
      }
    </script>
  </head>
  <body class="bg-default">
    <div id="app" class="flex min-h-dvh flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
